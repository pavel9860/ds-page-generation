name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev,multilang,pagegen]" ruff
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q -m "not slow"
