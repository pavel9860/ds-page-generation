[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-page-generation"
version = "0.2.0"
description = "Synthetic document photos with exact UV and 3D maps: layouts, physical page geometry, rendering"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "langid>=1.1",
    "wordfreq[cjk]>=3.1",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "numba>=0.60",
    "quadprog>=0.1.12",
    "scikit-fem>=10.0",
    "pymupdf>=1.24,<1.28",
    "pillow>=10.0",
    "fonttools>=4.40",
    "python-bidi>=0.6",
    "arabic-reshaper>=3.0",
    "pypardiso>=0.4",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "matplotlib>=3.8"]
export = ["ultralytics>=8.3"]
multilang = ["hwsynth[pages]", "faker>=30", "requests>=2.31", "regex>=2024.0", "wordfreq>=3.1", "ftfy>=6.2"]   # dspages.multilang
hand = ["hwsynth", "regex>=2023.0", "scikit-image>=0.22", "tesserocr>=2.7"]       # handwritten pages (dspages.hand)

[project.scripts]
dspages = "dspages.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["slow: long-running tests"]
