[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-page-generation"
version = "0.1.0"
description = "Synthetic document photos with exact UV and 3D maps: layouts, physical page geometry, rendering"
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "numba>=0.60",
    "quadprog>=0.1.12",
    "scikit-fem>=10.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "fonttools>=4.40",
    "python-bidi>=0.6",
    "pypardiso>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
dspages = "dspages.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
