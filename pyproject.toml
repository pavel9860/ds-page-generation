[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-page-generation"
version = "0.3.2"
description = "Synthetic document photos with exact UV and 3D maps: layouts, physical page geometry, rendering"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "langid>=1.1",
    "wordfreq[cjk]>=3.1",
    "scipy>=1.13",
    "opencv-python-headless>=4.9",
    "numba>=0.60",
    "quadprog>=0.1.12",
    "scikit-fem>=10.0",
    "pymupdf>=1.24,<1.28",
    "pillow>=10.0",
    "fonttools>=4.40",
    "python-bidi>=0.6",
    "arabic-reshaper>=3.0",
    "pypardiso>=0.4",
    "onnxruntime>=1.18",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "threadpoolctl>=3.4",
    "uharfbuzz>=0.39",
    "regex>=2024.0",
]

[project.optional-dependencies]
legacy = ["mini-racer>=0.12"]                                                        # dspages.layout.padma (Padma legacy-font tables)
corpus = ["duckdb>=1.0", "httpx>=0.27", "xgboost>=2.0", "torch>=2.2", "ultralytics>=8.4", "kaggle>=1.6"]   # acquire, ingest, fillpic
dev = ["pytest>=8", "pytest-xdist>=3.5", "matplotlib>=3.8"]
export = ["ultralytics>=8.3"]
multilang = ["hwsynth @ git+https://github.com/pavel9860/realistic_handwriting_153_scripts@v0.3.0", "lingua-language-detector>=2.0", "langdetect>=1.0.9", "faker>=30", "requests>=2.31", "regex>=2024.0", "wordfreq>=3.1", "ftfy>=6.2"]   # dspages.multilang
pagegen = ["hwsynth @ git+https://github.com/pavel9860/realistic_handwriting_153_scripts@v0.3.0"]                                                              # dspages.pagegen: handwritten pages, filled forms
hand = ["hwsynth @ git+https://github.com/pavel9860/realistic_handwriting_153_scripts@v0.3.0", "regex>=2023.0", "scikit-image>=0.22", "tesserocr>=2.7"]       # handwritten pages (dspages.hand)

[project.scripts]
dspages = "dspages.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_aside", ".tmp", "_logs", "runs"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "E402", "B905", "B007", "B008", "B019", "B023", "UP031"]
